name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, for example 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create a draft release for review'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Verify release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          test "$tag" = "v$version" || { echo "Tag must match package.json version ($version)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: x64 }
          - { os: windows-latest, platform: windows, arch: arm64 }
          - { os: macos-15, platform: macos, arch: arm64 }
          - { os: macos-15-intel, platform: macos, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils libarchive-tools libgtk-3-0 libnss3 libxss1 libxtst6 libasound2t64 libgbm1 xvfb
      - run: bun install --frozen-lockfile
      - name: Build installers
        run: bun run package --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/copy-my-things --smoke-test
      - name: Archive corresponding native sources
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: tar -czf dist/Copy-My-Things-native-sources.tar.gz -C release-support native-source
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*native-sources.tar.gz

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        shell: bash
        run: |
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "$TAG" release-artifacts/* \
            --target "$GITHUB_SHA" --title "Copy My Things $TAG" \
            --notes-file docs/RELEASE_NOTES.md "${flags[@]}"

name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, for example 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create a draft release for review'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Verify release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          test "$tag" = "v$version" || { echo "Tag must match package.json version ($version)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: x64 }
          - { os: windows-latest, platform: windows, arch: arm64 }
          - { os: macos-15, platform: macos, arch: arm64 }
          - { os: macos-15-intel, platform: macos, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils dbus-x11 libarchive-tools libgtk-3-0 libnss3 libxss1 libxtst6 libasound2t64 libgbm1 xvfb
      - run: bun install --frozen-lockfile
      - name: Build installers
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          bun run package --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: |
          appdir="dist/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked"
          sudo chown root:root "$appdir/chrome-sandbox"
          sudo chmod 4755 "$appdir/chrome-sandbox"
          dbus-run-session -- xvfb-run -a "$appdir/copy-my-things" --smoke-test 2>&1 | tee packaged-smoke.log
          grep -q ELECTRON_SMOKE_PASS packaged-smoke.log
      - name: Archive corresponding native sources
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: tar -czf dist/Copy-My-Things-native-sources.tar.gz -C release-support native-source
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*native-sources.tar.gz

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        shell: bash
        run: |
          # Listing also finds drafts. API/authentication errors must fail the job.
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases")
          state=$(jq -r --arg tag "$TAG" '
            [.[][] | select(.tag_name == $tag)][0] |
            if . == null then "missing" elif .draft then "draft" else "published" end
          ' <<< "$releases")

          if [ "$state" = "published" ]; then
            echo "::notice::Release $TAG is already published; keeping its assets unchanged. Use a new version for a new release."
            exit 0
          fi

          if [ "$state" = "missing" ]; then
            gh release create "$TAG" --draft \
              --target "$GITHUB_SHA" --title "Copy My Things $TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi

          # Resume incomplete drafts, including uploads interrupted by a prior run.
          gh release upload "$TAG" release-artifacts/* --clobber
          if [ "$DRAFT" != "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
